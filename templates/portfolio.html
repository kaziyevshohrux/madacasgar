<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/static/img/favicons/portfolio.ico" />
    <link rel="stylesheet" href="/static/css/portfolio.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      crossorigin="anonymous"
    />
    <title>Portfolio</title>
  </head>

  <body class="portfolio-frame"></body>
  <div class="container">
    <div class="left_section">
      <div class="profile">
        <div class="img">
          <img src="/static/img/icon/profile.svg" alt="Profile Image" />
        </div>
        <div class="name">{{ author.name }}</div>
        <div class="profession">{{ author.profession }}</div>
        <div class="sns">
         <div class="box"> <img src="/static/img/icon/sns-facebook.svg" class="icon" alt="Twitter"></div>
          <div class="box"> <img src="/static/img/icon/sns-instagram.svg"  class="icon" alt="LinkedIn"></div>
          <div class="box"> <img src="/static/img/icon/sns-twitter.svg" class="icon" alt="GitHub"></div>
          <div class="box"> <img src="/static/img/icon/sns-linkedin.svg" class="icon" alt="Instagram"></div>
          <div class="box"> <img src="/static/img/icon/sns-youtube.svg" class="icon" alt="Facebook"></div>
          
        </div>
      </div>
      
      <div class="detail"></div>
      <div class="marginer"></div>
      <div class="languages"></div>
      <div class="marginer"></div>
      <div class="skills"></div>
      <div class="marginer"></div>
      <div class="extra-skills"></div>

    </div>
    <div class="middle_section">
      <div class="highlight"></div>
      <div class="services"></div>
    </div>
    <div class="right_section"></div>
  </div>
</html>
